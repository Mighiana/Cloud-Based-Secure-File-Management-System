name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      # Real clamd so the EICAR test-signature test runs against ClamAV, not a stub.
      clamav:
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
        options: >-
          --health-cmd clamdcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30 --health-start-period 60s
    env:
      CLAMAV_HOST: localhost
      CLAMAV_PORT: "3310"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SecureFileUploadPortal.sln
      - run: dotnet build SecureFileUploadPortal.sln --no-restore -c Release -warnaserror
      - run: dotnet test SecureFileUploadPortal.sln --no-build -c Release --logger "console;verbosity=normal"
      - name: Check EF Core model matches migrations
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.31
          dotnet ef migrations has-pending-model-changes --project SecureFileUploadPortal --no-build --configuration Release

  lambda-and-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned, checksum-verified tools
        run: make bootstrap
      - run: make init-tf
      - name: Terraform fmt / validate / test (mocked provider, no AWS credentials)
        run: make fmt-check validate tf-test
      - run: make tflint
      - run: make checkov
      - run: make shellcheck
      - run: make lambda-test
