name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore SecureFileUploadPortal.sln
      - run: dotnet build SecureFileUploadPortal.sln --no-restore -c Release -warnaserror
      - run: dotnet test SecureFileUploadPortal.sln --no-build -c Release --logger "console;verbosity=normal"
      - name: Check EF Core model matches migrations
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.31
          dotnet ef migrations has-pending-model-changes --project SecureFileUploadPortal --no-build --configuration Release

  upload-scan-lambda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/upload-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/aws/upload-scan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
